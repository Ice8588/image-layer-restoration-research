[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-layer-restoration-research"
version = "0.1.0"
description = "Research on foreground removal, amodal completion, and controllable image editing for non-photorealistic 2D graphics."
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow", "scikit-image"]

[project.optional-dependencies]
test = ["pytest"]
perceptual = ["torch", "lpips"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
